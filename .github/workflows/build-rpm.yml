name: Build Fedora RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf install -y git rpm-build rpmdevtools tar gzip findutils python3 desktop-file-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source archive and RPM
        shell: bash
        run: |
          set -euxo pipefail
          VERSION=1.0.0
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p /tmp/digital-typewriter-${VERSION}
          cp -a digital-typewriter/. /tmp/digital-typewriter-${VERSION}/
          tar -C /tmp -czf ~/rpmbuild/SOURCES/digital-typewriter-${VERSION}.tar.gz digital-typewriter-${VERSION}
          cp digital-typewriter/rpm/digital-typewriter.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/digital-typewriter.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-typewriter-fedora-rpm
          path: /github/home/rpmbuild/RPMS/noarch/*.rpm
